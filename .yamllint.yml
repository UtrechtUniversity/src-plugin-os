---
# Shared by `yamllint` and ansible-lint (must include ansible-lint's required rules).
extends: default

ignore: |
  .venv/
  .git/
  files/

rules:
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  document-start: disable
  line-length: disable
  braces:
    min-spaces-inside: 0
    max-spaces-inside: 1
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
